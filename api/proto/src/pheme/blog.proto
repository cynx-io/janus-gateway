syntax = "proto3";

package pheme;

option go_package = "pheme/api/proto";

import "google/protobuf/timestamp.proto";
import "core.proto";
import "pheme/enum.proto";
import "pheme/object.proto";

service BlogService {
  rpc GetBlogById(GetBlogByIdRequest) returns (BlogResponse) {}
  rpc GetBlogByTitle(GetBlogByTitleRequest) returns (BlogResponse) {}
  rpc PaginateBlogs(PaginateBlogsRequest) returns (PaginateBlogsResponse) {}
  rpc CreateBlog(CreateBlogRequest) returns (BlogResponse) {}
  rpc UploadMedia(UploadMediaRequest) returns (UploadMediaResponse) {}
}

message UploadMediaRequest {
  core.BaseRequest base = 1;
  bytes file = 2;
  string filename = 3;
  MediaContentType media_content_type = 4;
}

message UploadMediaResponse {
  core.BaseResponse base = 1;
  string url = 2;
  string key = 3;
}

message CreateBlogRequest {
  core.BaseRequest base = 1;
  string title = 2;
  string content = 3;
  string group = 4;
  BlogContentType content_type = 5;
}

message GetBlogByIdRequest {
  core.BaseRequest base = 1;
  int32 id = 2;
}

message GetBlogByTitleRequest {
  core.BaseRequest base = 1;
  string title = 2;
}

message PaginateBlogsRequest {
  core.BaseRequest base = 1;
  int32 page = 2;
  int32 limit = 3;
  optional int32 user_id = 4;
  optional string group = 5;
}

message PaginateBlogsResponse {
  core.BaseResponse base = 1;
  repeated Blog blogs = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
  int32 total_items = 6;
  bool has_next_page = 7;
  bool has_previous_page = 8;
}

message BlogResponse {
  core.BaseResponse base = 1;
  Blog blog = 2;
}