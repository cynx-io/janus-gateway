  COMPETITION_LEVEL_LOW = 1;
  COMPETITION_LEVEL_MEDIUM = 2;
  COMPETITION_LEVEL_HIGH = 3;
  COMPETITION_LEVEL_SATURATED = 4;
}

enum SearchVolumeTrend {
