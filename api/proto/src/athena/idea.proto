syntax = "proto3";

package athena;

option go_package = "athena/api/proto";

import "google/protobuf/timestamp.proto";
import "core.proto";
import "athena/object.proto";
import "athena/enum.proto";

service IdeaService {
  rpc InitiateIdea(InitiateIdeaRequest) returns (InitiateIdeaResponse) {}
  rpc GenerateIdeas(GenerateIdeasRequest) returns (GenerateIdeasResponse) {}
  rpc GetValidationScore(GetValidationScoreRequest) returns (GetValidationScoreResponse) {}
  rpc GetTrendAnalysis(GetTrendAnalysisRequest) returns (GetTrendAnalysisResponse) {}
  rpc GetMarketData(GetMarketDataRequest) returns (GetMarketDataResponse) {}
  rpc GetCommunitySignals(GetCommunitySignalsRequest) returns (GetCommunitySignalsResponse) {}
  rpc GetCompetitionAnalysis(GetCompetitionAnalysisRequest) returns (GetCompetitionAnalysisResponse) {}
  rpc GetProblemValidation(GetProblemValidationRequest) returns (GetProblemValidationResponse) {}
  rpc GetBootstrapMetrics(GetBootstrapMetricsRequest) returns (GetBootstrapMetricsResponse) {}
  rpc GetRecommendation(GetRecommendationRequest) returns (GetRecommendationResponse) {}
  rpc GetTrendChart(GetTrendChartRequest) returns (GetTrendChartResponse) {}
  rpc GetMarketDemandChart(GetMarketDemandChartRequest) returns (GetMarketDemandChartResponse) {}
  rpc GetCompetitionChart(GetCompetitionChartRequest) returns (GetCompetitionChartResponse) {}
  rpc GetEngagementChart(GetEngagementChartRequest) returns (GetEngagementChartResponse) {}
  rpc GetRedditInsights(GetRedditInsightsRequest) returns (GetRedditInsightsResponse) {}
  rpc GetGithubInsights(GetGithubInsightsRequest) returns (GetGithubInsightsResponse) {}
  rpc GetHackerNewsInsights(GetHackerNewsInsightsRequest) returns (GetHackerNewsInsightsResponse) {}
  rpc GetInputAnalysis(GetInputAnalysisRequest) returns (GetInputAnalysisResponse) {}
}

message GetInputAnalysisRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
}

message GetInputAnalysisResponse {
  core.BaseResponse base = 1;
  optional InputAnalysis input_analysis = 2;
  Metadata metadata = 3;
}

message InputAnalysis {
  string original_idea = 1;
  repeated string processed_keywords = 2;
  repeated string tags = 3;
  string market_type = 4;
  int32 complexity_level = 5;
}

message ValidationScore {
  int32 overall_score = 1;
  int32 trend_momentum = 2;
  int32 market_demand = 3;
  int32 competition_level = 4;
  int32 bootstrap_viability = 5;
}

message TrendAnalysis {
  TrendDirection direction = 1;
  int32 momentum_score = 2;
  int32 growth_rate_6m = 3;
  int32 growth_rate_12m = 4;
  int32 sustainability_score = 5;
  int32 peak_interest_month = 6;
}

message MarketData {
  int32 search_volume_monthly = 1;
  SearchVolumeTrend search_volume_trend = 2;
  double cpc_average = 3;
  CompetitionLevel competition_intensity = 4;
  int32 keyword_difficulty = 5;
  CommercialIntent commercial_intent = 6;
}

message CommunitySignals {
  int32 hackernews_mentions = 1;
  int32 hackernews_sentiment = 2;
  int32 github_repositories = 3;
  int32 github_stars_total = 4;
  int32 github_activity_score = 5;
  int32 reddit_discussions = 6;
  int32 reddit_engagement = 7;
}

message CompetitionAnalysis {
  SaturationLevel saturation_level = 1;
  int32 competitor_count = 2;
  int32 market_leaders = 3;
  int32 avg_domain_authority = 4;
  int32 entry_difficulty = 5;
  int32 differentiation_opportunity = 6;
}

message ProblemValidation {
  Severity pain_level = 1;        // Using existing Severity enum values
  Frequency frequency = 2;         // Using existing Frequency enum values
  int32 current_solution_satisfaction = 3;
  int32 willingness_to_pay = 4;
  int32 urgency = 5;
  int32 market_education_required = 6;
}

message BootstrapMetrics {
  int32 time_to_first_dollar_days = 1;
  int32 customer_acquisition_difficulty = 2;
  int32 revenue_potential_monthly = 3;
  int32 break_even_customers = 4;
  int32 bootstrap_feasibility = 5;
}

message Recommendation {
  Verdict verdict = 1;
  int32 confidence_level = 2;
  RiskLevel risk_level = 3;
  int32 timeline_weeks = 4;
  int32 budget_required = 5;
}

// InitiateIdea endpoint - performs steps 1 & 2 and saves to database
message InitiateIdeaRequest {
  core.BaseRequest base = 1;
  string prompt = 2;
}

message InitiateIdeaResponse {
  core.BaseResponse base = 1;
  int32 idea_id = 2;
  InputAnalysis input = 3;
}

// Step 3 individual endpoints
message GetValidationScoreRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetValidationScoreResponse {
  core.BaseResponse base = 1;
  optional ValidationScore validation_score = 2;
  Metadata metadata = 3;
}

message GetTrendAnalysisRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message Metadata {
  bool require_login = 1;
  float token_generate_price = 2;
  string product_price_list_id = 3;
  int32 generated_times = 4;
}

message GetTrendAnalysisResponse {
  core.BaseResponse base = 1;
  optional TrendAnalysis trend_analysis = 2;
  Metadata metadata = 3;
}

message GetMarketDataRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetMarketDataResponse {
  core.BaseResponse base = 1;
  optional MarketData market_data = 2;
  Metadata metadata = 3;
}

message GetCommunitySignalsRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetCommunitySignalsResponse {
  core.BaseResponse base = 1;
  optional CommunitySignals community_signals = 2;
  Metadata metadata = 3;
}

message GetCompetitionAnalysisRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetCompetitionAnalysisResponse {
  core.BaseResponse base = 1;
  optional CompetitionAnalysis competition_analysis = 2;
  Metadata metadata = 3;
}

message GetProblemValidationRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetProblemValidationResponse {
  core.BaseResponse base = 1;
  optional ProblemValidation problem_validation = 2;
  Metadata metadata = 3;
}

message GetBootstrapMetricsRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetBootstrapMetricsResponse {
  core.BaseResponse base = 1;
  optional BootstrapMetrics bootstrap_metrics = 2;
  Metadata metadata = 3;
}

message GetRecommendationRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetRecommendationResponse {
  core.BaseResponse base = 1;
  optional Recommendation recommendation = 2;
  Metadata metadata = 3;
}

message GetTrendChartRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetTrendChartResponse {
  core.BaseResponse base = 1;
  repeated ChartDataPoint chart_data = 2;
  Metadata metadata = 3;
}

message GetMarketDemandChartRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetMarketDemandChartResponse {
  core.BaseResponse base = 1;
  repeated ChartDataPoint chart_data = 2;
  Metadata metadata = 3;
}

message GetCompetitionChartRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetCompetitionChartResponse {
  core.BaseResponse base = 1;
  repeated ChartDataPoint chart_data = 2;
  Metadata metadata = 3;
}

message GetEngagementChartRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetEngagementChartResponse {
  core.BaseResponse base = 1;
  repeated ChartDataPoint chart_data = 2;
  Metadata metadata = 3;
}

message GetRedditInsightsRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetRedditInsightsResponse {
  core.BaseResponse base = 1;
  optional RedditInsights reddit_insights = 2;
  Metadata metadata = 3;
}

message GetGithubInsightsRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetGithubInsightsResponse {
  core.BaseResponse base = 1;
  optional GithubInsights github_insights = 2;
  Metadata metadata = 3;
}

message GetHackerNewsInsightsRequest {
  core.BaseRequest base = 1;
  int32 idea_id = 2;
  bool generate = 3;
}

message GetHackerNewsInsightsResponse {
  core.BaseResponse base = 1;
  optional HackerNewsInsights hackernews_insights = 2;
  Metadata metadata = 3;
}

message GenerateIdeasRequest {
  core.BaseRequest base = 1;
  string prompt = 2;
  bool generate = 3;
}

message GenerateIdeasResponse {
  core.BaseResponse base = 1;
  repeated GeneratedIdea ideas = 2;
  Metadata metadata = 3;
}

message GeneratedIdea {
  string title = 1;
  string description = 2;
  repeated string key_features = 3;
  string market_segment = 4;
  int32 complexity_score = 5;
  repeated string target_audience = 6;
  string optimized_prompt = 7;
}
